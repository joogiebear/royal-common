name: Release

# Releases only when started manually from GitHub Actions. Besides the tag and the
# GitHub release, it publishes the jar to the maven branch, which plugins use as a
# Maven repository: https://raw.githubusercontent.com/joogiebear/royal-common/maven
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Release even when there are no new commits since the last tag'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compute version and changelog
        id: prep
        run: |
          set -euo pipefail
          git fetch --tags --force
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "Last tag: ${LAST_TAG:-<none>}"
          if [ -n "$LAST_TAG" ]; then RANGE="$LAST_TAG..HEAD"; else RANGE="HEAD"; fi

          # New commits since the last release, excluding release chores.
          NEW=$(git log $RANGE --no-merges --pretty=format:'%s' | grep -v -E '^chore\(release\)' || true)
          if [ -z "$NEW" ] && [ "${{ github.event.inputs.force }}" != "true" ]; then
            echo "No new commits since ${LAST_TAG:-start} - nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

          # YEAR.ISOWEEK.PATCH, the same scheme as the plugins (e.g. 2026.41.0).
          # %G is the year the ISO week belongs to; %Y would give 2027.53 on 1 Jan 2027.
          YEAR=$(TZ=America/Chicago date +%G)
          WEEK=$(( 10#$(TZ=America/Chicago date +%V) ))
          PATCH=0
          LATEST_THIS_WEEK=$(git tag -l "${YEAR}.${WEEK}.*" | sort -V | tail -1 || true)
          if [ -n "$LATEST_THIS_WEEK" ]; then
            PATCH=$(( ${LATEST_THIS_WEEK##*.} + 1 ))
          fi
          VERSION="${YEAR}.${WEEK}.${PATCH}"
          echo "New version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          python3 .github/release/changelog.py "$VERSION" "$RANGE" > RELEASE_NOTES.md
          touch CHANGELOG.md
          cat RELEASE_NOTES.md CHANGELOG.md > CHANGELOG.new && mv CHANGELOG.new CHANGELOG.md

      - name: Set pom version
        if: steps.prep.outputs.release == 'true'
        run: mvn -B versions:set -DnewVersion=${{ steps.prep.outputs.version }} -DgenerateBackupPoms=false

      - name: Build
        if: steps.prep.outputs.release == 'true'
        run: mvn -B verify

      - name: Locate jar
        if: steps.prep.outputs.release == 'true'
        id: jar
        run: |
          set -euo pipefail
          JAR="target/royal-common-${{ steps.prep.outputs.version }}.jar"
          test -f "$JAR"
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Commit bump + changelog, tag
        if: steps.prep.outputs.release == 'true'
        run: |
          set -euo pipefail
          git config user.name "joogiebear"
          git config user.email "joogiebear@protonmail.com"
          git add pom.xml CHANGELOG.md
          git commit -m "chore(release): ${{ steps.prep.outputs.version }}"
          git tag "${{ steps.prep.outputs.version }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "${{ steps.prep.outputs.version }}"

      - name: Publish to the maven branch
        if: steps.prep.outputs.release == 'true'
        run: |
          set -euo pipefail
          REPO_DIR="$RUNNER_TEMP/maven"
          if git ls-remote --exit-code --heads origin maven >/dev/null; then
            git fetch origin maven
            git worktree add -B maven "$REPO_DIR" origin/maven
          else
            git worktree add --orphan -b maven "$REPO_DIR"
          fi
          # deploying straight into the branch keeps maven-metadata.xml listing every version
          mvn -B deploy -DskipTests -DaltDeploymentRepository=local::file://"$REPO_DIR"
          cd "$REPO_DIR"
          git add -A
          git commit -m "chore(release): publish ${{ steps.prep.outputs.version }}"
          git push origin maven

      - name: GitHub Release
        if: steps.prep.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.prep.outputs.version }}" \
            "${{ steps.jar.outputs.path }}" \
            --title "${{ steps.prep.outputs.version }}" \
            --notes-file RELEASE_NOTES.md
